<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  
  <!-- Gradient Background -->
  <defs>
    <linearGradient id="bgGradient" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FF4D8D"/>
      <stop offset="0.5" stop-color="#FF5E5B"/>
      <stop offset="1" stop-color="#FF9F43"/>
    </linearGradient>

    <linearGradient id="houseGradient" x1="150" y1="220" x2="360" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#FFE7D6"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="120" fill="url(#bgGradient)"/>

  <!-- Photo Frame -->
  <rect x="110" y="120" width="292" height="220" rx="28" fill="rgba(255,255,255,0.18)" stroke="white" stroke-width="12"/>

  <!-- Sun -->
  <circle cx="330" cy="180" r="26" fill="#FFF1C1"/>

  <!-- Mountains -->
  <path d="M145 305L215 225L270 285L315 240L375 305H145Z" fill="#FFD6D6"/>

  <!-- House Body -->
  <rect x="180" y="290" width="150" height="120" rx="22" fill="url(#houseGradient)"/>

  <!-- Roof -->
  <path d="M150 315L255 225L360 315"
        stroke="white"
        stroke-width="22"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <!-- Door -->
  <rect x="235" y="345" width="40" height="65" rx="10" fill="#FF6B6B"/>

</svg>